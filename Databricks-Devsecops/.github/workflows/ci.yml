name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check src tests .github/pr-guard

  bundle-validate:
    name: Validate Databricks bundle
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Databricks secrets are not configured
        if: env.DATABRICKS_HOST == '' || env.DATABRICKS_TOKEN == ''
        run: echo "::notice::DATABRICKS_HOST / DATABRICKS_TOKEN not set — skipping bundle validation."
      - uses: databricks/setup-cli@main
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != ''
      - name: databricks bundle validate
        if: env.DATABRICKS_HOST != '' && env.DATABRICKS_TOKEN != ''
        run: databricks bundle validate -t dev
