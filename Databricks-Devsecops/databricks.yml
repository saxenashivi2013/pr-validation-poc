# Databricks Asset Bundle — retail lakehouse demo (Databricks Free Edition compatible).
# Authentication comes from the environment (DATABRICKS_HOST / DATABRICKS_TOKEN) or your
# local CLI profile, so no workspace URL is hard-coded here.
bundle:
  name: retail_lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog. Free Edition gives you one named "workspace".
    default: workspace
  schema:
    description: Schema that holds all bronze/silver/gold tables and the raw volume.
    default: retail_dev
  n_orders:
    description: Number of synthetic orders to generate (each has 1-4 lines).
    default: "5000"

targets:
  dev:
    default: true
    mode: development          # prefixes job names with [dev <you>] and pauses schedules
    variables:
      schema: retail_dev

  prod:
    mode: production
    variables:
      schema: retail_prod
    workspace:
      # Free Edition has a single user; keep prod artefacts under your own home folder.
      root_path: ~/.bundle/${bundle.name}/prod
